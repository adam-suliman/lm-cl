# Performance candidate, not a Zyphra paper architecture.
# About 1M NON-EMBEDDING parameters; total count includes the unchanged tokenizer table.
# LR 0.003 is an explicit 5M-reference assumption for bounded timing, not a tuned scientific LR.
name: exploratory_1m_nonembedding
layers: 5
hidden_size: 128
attention_heads: 2
head_dim: 64
mlp_hidden_size: 512
vocab_size: 151680
max_position_embeddings: 2048
expected_non_embedding_parameters: 991616
expected_total_parameters: 20668800
learning_rate: 0.003
dropout: 0.0
initializer_std: 0.02
layer_norm_epsilon: 0.00001
use_bias: true
activation: gelu
gelu_approximation: none
position_embedding_type: learned_absolute
tie_word_embeddings: true
